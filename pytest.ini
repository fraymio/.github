[pytest]
markers =
    int: integration tests skipped by default, (only evaluate with 'pytest --int')
    e2e: end to end tests skipped by default, (only evaluate with 'pytest --e2e')

testpaths =
    tests

# Lets tests `import review` without packaging pr_review/.
pythonpath =
    pr_review

addopts = -ra --strict-markers --strict-config
